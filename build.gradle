buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.0'
    }
}

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'edu.sc.seis.launch4j' version '3.0.5'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:all"
    options.deprecation = true
}

project.ext.lwjglVersion = "3.4.1"
project.ext.lwjglNatives = "natives-windows"
def mainClassName = "de.delautrer.Main"

tasks.register('run', JavaExec) {
    group = 'application'
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    // --- Core LWJGL ---
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl::$lwjglNatives"

    // --- Window & Input ---
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-glfw::$lwjglNatives"

    // --- Rendering: Vulkan (no native binary needed on Windows) ---
    implementation "org.lwjgl:lwjgl-vulkan"

    // --- Audio: OpenAL ---
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-openal::$lwjglNatives"

    // --- Texture & Font loading: STB ---
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"

    // --- Memory management ---
    implementation "org.lwjgl:lwjgl-jemalloc"
    implementation "org.lwjgl:lwjgl-jemalloc::$lwjglNatives"

    // --- Math ---
    implementation "org.joml:joml:1.10.5"

    implementation 'com.google.code.gson:gson:2.13.2'
}

task compileShaders {
    group = 'build'
    description = 'Compiles all GLSL shaders in src/main/resources/shaders to SPIR-V'

    doLast {
        def shaderDir = file("src/main/resources/shaders")
        if (shaderDir.exists()) {
            shaderDir.eachFileMatch(~/.*(\.vert|\.frag)/) { shaderFile ->
                def outputFile = file("${shaderFile.absolutePath}.spv")
                println "Compiling ${shaderFile.name} -> ${outputFile.name}"
                exec {
                    commandLine 'glslc', shaderFile.absolutePath, '-o', outputFile.absolutePath
                }
            }
        }
    }
}

processResources.dependsOn compileShaders

shadowJar {
    archiveBaseName.set('VoxelEngine-Raw')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': mainClassName
    }
}

task proguard(type: proguard.gradle.ProGuardTask, dependsOn: shadowJar) {
    injars shadowJar.archiveFile
    outjars "build/libs/VoxelEngine-Obfuscated.jar"

    libraryjars "${System.getProperty('java.home')}/jmods"

    configuration 'proguard-rules.pro'
}

launch4j {
    mainClassName = mainClassName
    copyConfigurable = project.tasks.proguard.outputs.files.singleFile
    jarTask = project.tasks.proguard

    outfile = "VoxelEngine.exe"
    headerType = "gui"
    errTitle = "Voxel Engine Error"
    downloadUrl = "https://java.com/download"

    bundledJrePath = 'jre'

    jreMinVersion = '21'
}

task buildExe(dependsOn: ['createExe']) {
    group = 'build'
    description = 'Baut das Fat-JAR, verschleiert es und generiert die .exe'
}