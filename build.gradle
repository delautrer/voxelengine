buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.0'
    }
}

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'edu.sc.seis.launch4j' version '3.0.5'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:all"
    options.deprecation = true
}

project.ext.lwjglVersion = "3.4.1"
project.ext.allNatives = [
    "natives-windows",
    "natives-linux",
    "natives-macos",
    "natives-macos-arm64"
]
def mainClassName = "de.delautrer.Main"

tasks.register('run', JavaExec) {
    group = 'application'
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    // --- Core LWJGL ---
    implementation "org.lwjgl:lwjgl"
    project.ext.allNatives.each { implementation "org.lwjgl:lwjgl::$it" }

    // --- Window & Input ---
    implementation "org.lwjgl:lwjgl-glfw"
    project.ext.allNatives.each { implementation "org.lwjgl:lwjgl-glfw::$it" }

    // --- Rendering: Vulkan (macOS benötigt MoltenVK Natives) ---
    implementation "org.lwjgl:lwjgl-vulkan"
    implementation "org.lwjgl:lwjgl-vulkan::natives-macos"
    implementation "org.lwjgl:lwjgl-vulkan::natives-macos-arm64"

    // --- Audio: OpenAL ---
    implementation "org.lwjgl:lwjgl-openal"
    project.ext.allNatives.each { implementation "org.lwjgl:lwjgl-openal::$it" }

    // --- Texture & Font loading: STB ---
    implementation "org.lwjgl:lwjgl-stb"
    project.ext.allNatives.each { implementation "org.lwjgl:lwjgl-stb::$it" }

    // --- Memory management ---
    implementation "org.lwjgl:lwjgl-jemalloc"
    project.ext.allNatives.each { implementation "org.lwjgl:lwjgl-jemalloc::$it" }

    // --- Math ---
    implementation "org.joml:joml:1.10.5"

    implementation 'com.google.code.gson:gson:2.13.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

task runTagIoTest(type: JavaExec) {
    group = 'verification'
    mainClass = 'de.delautrer.game.nbt.TagIoTest'
    classpath = sourceSets.test.runtimeClasspath
}

task runFeatureRegistryTest(type: JavaExec) {
    group = 'verification'
    mainClass = 'de.delautrer.game.world.generation.feature.FeatureRegistryTest'
    classpath = sourceSets.test.runtimeClasspath
}

task runStructureRegistryTest(type: JavaExec) {
    group = 'verification'
    mainClass = 'de.delautrer.game.world.generation.structure.StructureRegistryTest'
    classpath = sourceSets.test.runtimeClasspath
}

task runFindCommandTest(type: JavaExec) {
    group = 'verification'
    mainClass = 'de.delautrer.game.commands.FindCommandTest'
    classpath = sourceSets.test.runtimeClasspath
}

task runChestInteractionTest(type: JavaExec) {
    group = 'verification'
    mainClass = 'de.delautrer.game.blocks.ChestInteractionTest'
    classpath = sourceSets.test.runtimeClasspath
}

test {
    dependsOn runTagIoTest, runFeatureRegistryTest, runStructureRegistryTest, runFindCommandTest, runChestInteractionTest
}

task compileShaders {
    group = 'build'
    description = 'Compiles all GLSL shaders in src/main/resources/shaders to SPIR-V'

    doLast {
        def shaderDir = file("src/main/resources/shaders")
        if (shaderDir.exists()) {
            shaderDir.eachFileMatch(~/.*(\.vert|\.frag)/) { shaderFile ->
                def outputFile = file("${shaderFile.absolutePath}.spv")
                println "Compiling ${shaderFile.name} -> ${outputFile.name}"
                exec {
                    commandLine 'glslc', shaderFile.absolutePath, '-o', outputFile.absolutePath
                }
            }
        }
    }
}

processResources.dependsOn compileShaders

shadowJar {
    archiveBaseName.set('Veinstride-Raw')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': mainClassName
    }
}

task proguard(type: proguard.gradle.ProGuardTask, dependsOn: shadowJar) {
    injars shadowJar.archiveFile
    outjars "build/libs/Veinstride-Obfuscated.jar"

    libraryjars "${System.getProperty('java.home')}/jmods"

    configuration 'proguard-rules.pro'
}

def projectDrive = project.projectDir.absolutePath.substring(0, 3) // e.g. "E:\"
def safeTempDir = projectDrive + "Temp_VoxelEngine"

launch4j {
    mainClassName = mainClassName
    copyConfigurable = project.tasks.proguard.outputs.files.singleFile
    jarTask = project.tasks.proguard

    outfile = "Veinstride.exe"
    headerType = "gui"
    errTitle = "Veinstride Error"
    downloadUrl = "https://java.com/download"

    bundledJrePath = 'jre'

    jreMinVersion = '21'
    icon = "${safeTempDir}/icon.ico"
}

task copyIconToTemp(type: Copy) {
    doNotTrackState("Avoid locking temp directory")
    from 'icon.ico'
    into safeTempDir
}

tasks.named('createExe') {
    dependsOn copyIconToTemp
}

task buildExe(dependsOn: ['createExe']) {
    group = 'build'
    description = 'Baut das Fat-JAR, verschleiert es und generiert die .exe'
}

def jreCacheDir = file("${buildDir}/jres")

task downloadWindowsJre {
    def destFile = file("${jreCacheDir}/windows-jre.zip")
    outputs.file(destFile)
    doLast {
        jreCacheDir.mkdirs()
        if (!destFile.exists()) {
            println "Downloading Windows JRE..."
            ant.get(src: 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jre_x64_windows_hotspot_21.0.2_13.zip', dest: destFile, skipexisting: 'true')
        }
    }
}

task downloadLinuxJre {
    def destFile = file("${jreCacheDir}/linux-jre.tar.gz")
    outputs.file(destFile)
    doLast {
        jreCacheDir.mkdirs()
        if (!destFile.exists()) {
            println "Downloading Linux JRE..."
            ant.get(src: 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jre_x64_linux_hotspot_21.0.2_13.tar.gz', dest: destFile, skipexisting: 'true')
        }
    }
}

task downloadMacJre {
    def destFile = file("${jreCacheDir}/mac-jre.tar.gz")
    outputs.file(destFile)
    doLast {
        jreCacheDir.mkdirs()
        if (!destFile.exists()) {
            println "Downloading Mac JRE..."
            ant.get(src: 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jre_x64_mac_hotspot_21.0.2_13.tar.gz', dest: destFile, skipexisting: 'true')
        }
    }
}

task extractWindowsJre(type: Copy, dependsOn: downloadWindowsJre) {
    def destDir = file("${jreCacheDir}/windows-extracted")
    from zipTree(file("${jreCacheDir}/windows-jre.zip"))
    into destDir
    eachFile { FileCopyDetails fcp ->
        fcp.path = fcp.path.replaceFirst("^jdk-[^/]+/", "")
    }
    includeEmptyDirs = false
}

task extractLinuxJre(type: Copy, dependsOn: downloadLinuxJre) {
    def destDir = file("${jreCacheDir}/linux-extracted")
    from tarTree(resources.gzip(file("${jreCacheDir}/linux-jre.tar.gz")))
    into destDir
    eachFile { FileCopyDetails fcp ->
        fcp.path = fcp.path.replaceFirst("^jdk-[^/]+/", "")
    }
    includeEmptyDirs = false
}

task extractMacJre(type: Copy, dependsOn: downloadMacJre) {
    def destDir = file("${jreCacheDir}/mac-extracted")
    from tarTree(resources.gzip(file("${jreCacheDir}/mac-jre.tar.gz")))
    into destDir
    eachFile { FileCopyDetails fcp ->
        fcp.path = fcp.path.replaceFirst("^jdk-[^/]+/", "")
    }
    includeEmptyDirs = false
}

task bundleWindows(type: Copy, dependsOn: ['buildExe', 'extractWindowsJre']) {
    def bundleDir = file("${buildDir}/bundles/windows")
    from(project.tasks.createExe.outputs.files.filter { it.name.endsWith('.exe') }) {
        into ""
    }
    from("${jreCacheDir}/windows-extracted") {
        into "jre"
    }
    destinationDir = bundleDir
}

task bundleLinux(dependsOn: ['proguard', 'extractLinuxJre']) {
    def bundleDir = file("${buildDir}/bundles/linux")
    doLast {
        bundleDir.mkdirs()
        def stubFile = file("gradle/stub_linux.sh")
        def jarFile = project.tasks.proguard.outputs.files.singleFile
        def outFile = file("${bundleDir}/Veinstride")
        
        if (outFile.exists()) outFile.delete()
        def stubText = stubFile.text.replaceAll("\r\n", "\n")
        outFile.withOutputStream { out ->
            out.write(stubText.getBytes("UTF-8"))
            jarFile.withInputStream { out << it }
        }
    }
}

task copyLinuxJre(type: Copy, dependsOn: ['bundleLinux']) {
    from("${jreCacheDir}/linux-extracted")
    into "${buildDir}/bundles/linux/jre"
}

task bundleMacos(dependsOn: ['proguard', 'extractMacJre']) {
    def bundleDir = file("${buildDir}/bundles/macos/Veinstride.app")
    doLast {
        bundleDir.mkdirs()
        def stubFile = file("gradle/stub_mac.sh")
        def jarFile = project.tasks.proguard.outputs.files.singleFile
        
        def macOsDir = file("${bundleDir}/Contents/MacOS")
        macOsDir.mkdirs()
        def outFile = file("${macOsDir}/Veinstride")
        
        if (outFile.exists()) outFile.delete()
        def stubText = stubFile.text.replaceAll("\r\n", "\n")
        outFile.withOutputStream { out ->
            out.write(stubText.getBytes("UTF-8"))
            jarFile.withInputStream { out << it }
        }
    }
}

task copyMacResources(type: Copy, dependsOn: ['bundleMacos']) {
    from("gradle/Info.plist") {
        into "Contents"
    }
    // Fallback falls icon.icns existiert
    from("icon.icns") {
        into "Contents/Resources"
    }
    from("${jreCacheDir}/mac-extracted") {
        into "Contents/PlugIns/jre"
    }
    destinationDir = file("${buildDir}/bundles/macos/Veinstride.app")
}

task zipBundles(dependsOn: ['bundleWindows', 'copyLinuxJre', 'copyMacResources']) {
    doLast {
        def versionStr = project.hasProperty('version') && project.version != 'unspecified' ? project.version : "1.0"
        def outDir = file("${buildDir}/bundles")
        
        ['windows', 'linux', 'macos'].each { osName ->
            def sourceDir = file("${buildDir}/bundles/${osName}")
            def zipName1 = "Veinstride_alpha-${osName}.zip"
            def zipName2 = "Veinstride-${versionStr}_alpha-${osName}.zip"
            
            ant.zip(destfile: "${outDir}/${zipName1}") {
                if (osName == 'linux') {
                    zipfileset(dir: sourceDir, includes: "Veinstride", filemode: "755")
                    zipfileset(dir: sourceDir, includes: "jre/bin/*", filemode: "755")
                    zipfileset(dir: sourceDir, excludes: "Veinstride, jre/bin/*")
                } else if (osName == 'macos') {
                    zipfileset(dir: sourceDir, includes: "Veinstride.app/Contents/MacOS/Veinstride", filemode: "755")
                    zipfileset(dir: sourceDir, includes: "Veinstride.app/Contents/PlugIns/jre/Contents/Home/bin/*", filemode: "755")
                    zipfileset(dir: sourceDir, excludes: "Veinstride.app/Contents/MacOS/Veinstride, Veinstride.app/Contents/PlugIns/jre/Contents/Home/bin/*")
                } else {
                    fileset(dir: sourceDir)
                }
            }
            
            ant.copy(file: "${outDir}/${zipName1}", tofile: "${outDir}/${zipName2}")
        }
    }
}

task buildAllBundles(dependsOn: ['zipBundles']) {
    group = 'build'
    description = 'Baut alle OS-Bundles als ZIP-Archive in build/bundles'
}