    implementation "org.lwjgl:lwjgl-shaderc::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-spng::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-spvc::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-tinyexr::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-tinyfd::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-vma::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-xxhash::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-yoga::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-zstd::$lwjglNatives"
    implementation "org.joml:joml:1.10.5"
    implementation "org.lwjgl:lwjgl-stb:3.3.3"
    runtimeOnly "org.lwjgl:lwjgl-stb:3.3.3:natives-windows"

    implementation 'com.google.code.gson:gson:2.13.2'
}

shadowJar {
    archiveBaseName.set('VoxelEngine-Raw')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': mainClassName
    }
}

task proguard(type: proguard.gradle.ProGuardTask, dependsOn: shadowJar) {
    injars shadowJar.archiveFile
    outjars "build/libs/VoxelEngine-Obfuscated.jar"

    libraryjars "${System.getProperty('java.home')}/jmods"

    configuration 'proguard-rules.pro'
}

launch4j {
    mainClassName = mainClassName
    copyConfigurable = project.tasks.proguard.outputs.files.singleFile
    jarTask = project.tasks.proguard

    outfile = "VoxelEngine.exe"
    headerType = "gui"
    errTitle = "Voxel Engine Error"
    downloadUrl = "https://java.com/download"

    bundledJrePath = 'jre'

    jreMinVersion = '21'
}

task buildExe(dependsOn: ['createExe']) {
    group = 'build'
    description = 'Baut das Fat-JAR, verschleiert es und generiert die .exe'
}